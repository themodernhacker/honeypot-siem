# Cowrie configuration overrides
# Cowrie reads this file on top of the built-in cowrie.cfg.dist, so we only
# need to set the values we want to change. Missing keys fall back to defaults.

[honeypot]
# Hostname the attacker sees once "logged in", make it look like a real box
hostname = web-prod-01
# Where Cowrie writes its logs inside the container
log_path = var/log/cowrie

[ssh]
enabled = true
# Cowrie listens on 2222 inside the container (mapped to host 2222)
listen_endpoints = tcp:2222:interface=0.0.0.0
# SSH banner shown to the attacker (spoof a common OpenSSH version)
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

[telnet]
# We only want the SSH honeypot for this lab
enabled = false

# --- Outputs -------------------------------------------------------------
# JSON output is what Wazuh ingests. Explicitly enabled & pointed at cowrie.json
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = true

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log
format = text
